# Internal permissions; leader is the protected owner / Внутренние права; лидер — защищённый владелец
roles:
  leader:
    display-name: Leader
    priority: 1000
    color: gold
    prefix: ''
    actions: ['*']
  member:
    display-name: Member
    priority: 0
