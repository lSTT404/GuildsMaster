  target-online: "<red>The target must be online and visible."
  full: "<red>This guild is full."
  kicked: "<green>Member removed."
  leader-leave: "<red>Transfer leadership or disband the guild first."
  leave-done: "<green>You left the guild."
  transfer-done: "<green>Leadership transferred."
