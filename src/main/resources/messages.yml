# MiniMessage and literal placeholders in braces. Empty strings mute messages.
# MiniMessage и текстовые плейсхолдеры в фигурных скобках. Пустые строки скрывают сообщения.
prefix: "<gradient:#FFD000:#FF9A00><bold>GUILDMASTER</bold></gradient> <dark_gray>»</dark_gray>"
error:
  starting: "<yellow>Guild storage is starting."
  usage: "<red>Invalid command or arguments. See /guild help or /guildadmin help."
  player: "<red>This command requires a player."
  permission: "<red>You don't have permission."
  rank: "<red>Your guild rank cannot perform this action."
  disabled: "<red>The administrator disabled {feature}."
  rate: "<red>Too many requests. Try again shortly."
  storage: "<red>The guild database could not complete the operation."
  confirmation: "<red>This confirmation is invalid or has expired."
  cooldown: "<red>Try again in {seconds}s."
help:
  player: "<gold>GuildMaster commands\n<gray>/guild create [name] [currency], info [guild], list, members, settings\n<gray>/guild invite <white>PLAYER</white>, invitations, accept GUILD, deny GUILD, apply GUILD, applications\n<gray>/guild application accept|deny PLAYER, kick PLAYER, role PLAYER RANK, transfer PLAYER\n<gray>/guild rename NAME, description TEXT, leave, delete, disband, confirm TOKEN\n<gray>/guild alliance|war list|info|send|accept|deny|remove [GUILD]\n<gray>/guild sethome, home, delhome, light on|off, chat TEXT, history [PAGE]\n<gray>/guild top, statistics, announce [TEXT], upgrade, level, territory claim|release|list"
  admin: "<gold>GuildMaster administration\n<gray>/guildadmin reload, info [GUILD], debug, backup\n<gray>/guildadmin delete GUILD [TOKEN], migrate check|apply [TOKEN], restore FILE [TOKEN]\n<gray>/guildadmin payment, payment resolve ID verified"
guild:
  created: "<green>Guild {guild} created."
  not-found: "<red>Guild not found."
